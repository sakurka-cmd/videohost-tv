name: Build Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'videohost-tv/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to push APK back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > videohost-tv/app/videohost-release.keystore
          ls -la videohost-tv/app/videohost-release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > videohost-tv/keystore.properties << EOF
          storeFile=videohost-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Strip leading spaces from heredoc
          sed -i 's/^  //' videohost-tv/keystore.properties
          cat videohost-tv/keystore.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('videohost-tv/**/*.gradle*', 'videohost-tv/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build release APK
        working-directory: videohost-tv
        run: ./gradlew assembleRelease --no-daemon

      - name: Also build debug APK (for in-place updates on TV boxes)
        working-directory: videohost-tv
        run: ./gradlew assembleDebug --no-daemon

      - name: Extract version
        id: version
        working-directory: videohost-tv
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Detected: version=$VERSION code=$CODE"

      - name: Rename APKs
        run: |
          mkdir -p download
          cp videohost-tv/app/build/outputs/apk/release/app-release.apk \
             download/VideoHostTV-v${{ steps.version.outputs.version }}.apk
          cp videohost-tv/app/build/outputs/apk/debug/app-debug.apk \
             download/VideoHostTV-debug-v${{ steps.version.outputs.version }}.apk
          ls -la download/

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VideoHostTV-v${{ steps.version.outputs.version }}
          path: |
            download/*.apk
          retention-days: 30

      - name: Commit APKs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/*.apk
          if git diff --staged --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "build: release v${{ steps.version.outputs.version }} (code ${{ steps.version.outputs.code }}) [skip ci]"
            git push
            echo "Pushed APKs to repo"
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            download/VideoHostTV-v${{ steps.version.outputs.version }}.apk
            download/VideoHostTV-debug-v${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
